<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homelab Status</title>

  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <h1>Homelab Status</h1>

  <div class="refresh-status">
    <span id="refresh-state">● Auto Refresh: 10s</span>
    <span id="last-updated">最終更新: --:--:--</span>
  </div>

  <h2>Nodes</h2>

  <button id="refresh">更新</button>

  <table>
    <thead>
      <tr>
        <th>Node</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="nodes">
      <tr><td colspan="2">読み込み中...</td></tr>
    </tbody>
  </table>

  <h2>Pods</h2>
  <button id="refresh-pods">更新</button>

  <table>
    <thead>
      <tr>
        <th>Node</th>
        <th>Namespace</th>
        <th>Pod</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="pods">
      <tr><td colspan="4">読み込み中...</td></tr>
    </tbody>
  </table>

  <script src="/js/app.js"></script>
</body>
</html>
